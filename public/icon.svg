<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="96" fill="#0B3B60"/>
  <!-- Tricolor Bar at Top -->
  <rect x="0" y="0" width="512" height="18" fill="#FF9933"/>
  <rect x="0" y="18" width="512" height="18" fill="#FFFFFF"/>
  <rect x="0" y="36" width="512" height="18" fill="#138808"/>
  
  <!-- Outer Gold Ring -->
  <circle cx="256" cy="275" r="170" fill="none" stroke="#D4AF37" stroke-width="8"/>
  <circle cx="256" cy="275" r="156" fill="#072F5F" stroke="#FFFFFF" stroke-width="3"/>
  
  <!-- Ashoka Chakra Spokes Motif -->
  <circle cx="256" cy="275" r="48" fill="none" stroke="#FFFFFF" stroke-width="6"/>
  <circle cx="256" cy="275" r="14" fill="#FF9933"/>
  <g stroke="#FFFFFF" stroke-width="4">
    <line x1="256" y1="227" x2="256" y2="323"/>
    <line x1="208" y1="275" x2="304" y2="275"/>
    <line x1="222" y1="241" x2="290" y2="309"/>
    <line x1="222" y1="309" x2="290" y2="241"/>
  </g>
  
  <!-- Text Label -->
  <text x="256" y="170" font-family="'Hind', sans-serif" font-size="28" font-weight="bold" fill="#FF9933" text-anchor="middle" letter-spacing="2">
    भारत की जनगणना
  </text>
  <text x="256" y="380" font-family="'Hind', sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
    प्रगणक सर्वेक्षण (PE)
  </text>
  <text x="256" y="415" font-family="'Hind', sans-serif" font-size="18" font-weight="600" fill="#93C5FD" text-anchor="middle">
    CENSUS OF INDIA
  </text>
</svg>
